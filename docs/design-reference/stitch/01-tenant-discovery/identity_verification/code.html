<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base { html, body { width: 100vw; margin: 0; padding: 0; background-color: #fcf8f8; } body { overscroll-behavior: none; } .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } } ::-webkit-scrollbar { display: none; }</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: 'class', theme: { extend: { colors: { 'on-background': '#1c1b1b', 'on-primary-fixed-variant': '#065312', 'on-secondary-fixed': '#191c1b', 'secondary-container': '#dfe0dd', 'tertiary': '#6c0002', 'on-primary-container': '#81c97a', 'surface-container': '#f0edec', 'secondary': '#5c5f5d', 'outline': '#717a6c', 'on-tertiary-fixed': '#410001', 'on-tertiary-fixed-variant': '#930004', 'primary-fixed-dim': '#8fd887', 'surface': '#fcf8f8', 'on-surface': '#1c1b1b', 'on-tertiary': '#ffffff', 'on-secondary': '#ffffff', 'outline-variant': '#c0c9ba', 'inverse-surface': '#313030', 'surface-tint': '#276c28', 'error': '#ba1a1a', 'background': '#fcf8f8', 'surface-dim': '#dcd9d9', 'on-error-container': '#93000a', 'surface-variant': '#e5e2e1', 'secondary-fixed': '#e2e3e0', 'tertiary-fixed-dim': '#ffb4a9', 'secondary-fixed-dim': '#c5c7c4', 'on-primary-fixed': '#002203', 'surface-container-low': '#f6f3f2', 'inverse-on-surface': '#f3f0ef', 'on-tertiary-container': '#ff9e91', 'surface-container-highest': '#e5e2e1', 'surface-container-lowest': '#ffffff', 'tertiary-fixed': '#ffdad5', 'on-primary': '#ffffff', 'primary-fixed': '#aaf5a0', 'on-error': '#ffffff', 'tertiary-container': '#970004', 'on-secondary-fixed-variant': '#454745', 'error-container': '#ffdad6', 'on-secondary-container': '#616361', 'primary': '#003c08', 'on-surface-variant': '#41493e', 'primary-container': '#0a5514', 'surface-container-high': '#ebe7e7', 'inverse-primary': '#8fd887', 'surface-bright': '#fcf8f8' }, borderRadius: { 'DEFAULT': '0.25rem', 'lg': '0.5rem', 'xl': '0.75rem', 'full': '9999px' }, spacing: { 'stack-md': '16px', 'container-margin': '20px', 'unit': '4px', 'section-gap': '48px', 'gutter': '16px', 'stack-sm': '8px', 'stack-lg': '32px' }, fontFamily: { 'body-lg': ['Hanken Grotesk'], 'headline-lg': ['Hanken Grotesk'], 'display-lg': ['Hanken Grotesk'], 'label-sm': ['Hanken Grotesk'], 'headline-sm': ['Hanken Grotesk'], 'headline-md': ['Hanken Grotesk'], 'label-md': ['Hanken Grotesk'], 'body-md': ['Hanken Grotesk'] } } } };</script></head><body class="bg-background pt-safe pb-safe flex flex-col min-h-screen"><main class="flex flex-col flex-1 relative w-full"><div class="flex flex-col w-full h-full relative overflow-hidden bg-background">
<div class="flex-1 flex flex-col pt-stack-lg px-container-margin pb-stack-lg overflow-y-auto z-10 relative">
<div class="flex-none mb-stack-lg flex justify-center">
<div class="w-24 h-24 rounded-full bg-white flex items-center justify-center shadow-sm relative overflow-hidden border border-outline-variant/30">
  <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuCEbsHxvbB2DmwrcL8_Z5Fl7IrXQJQbbXm4yuz7KWvoXu5gjnGEln2yOQk43DUJ77kJD_KtWr_cfawm49XeFV5rygGF881zIzxb6-YeZfIOqp5Wje0PkUcdN8cckgEE-lO5F3BZQjsNysW7pCFMAgUEYYiD8LN2oZpoM85O03wgP3zDI2wWsUD_Q3vvRVwTMjbB8jkPzVoohGE8ph7J-KwKaftJNp4xg8gdRM3rigYRmFYp_6DnNX2RcQO82G246N04h7HqqRuQubA" alt="House For Rent Logo" class="w-full h-full object-contain">
  <div class="absolute -right-1 -top-1 w-6 h-6 rounded-full bg-surface-container-highest border-2 border-surface flex items-center justify-center z-10">
    <span class="material-symbols-outlined text-primary text-[14px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
  </div>
</div>
</div>
<h1 class="text-headline-lg text-on-background mb-stack-md text-center">Let's verify your identity</h1>
<p class="text-body-lg text-on-surface-variant text-center mb-section-gap px-gutter">
            To keep our community safe, we verify every tenant before they can request viewings. This helps us ensure you're meeting a real officer at a real home.
        </p>
<div class="bg-surface-container rounded-xl p-stack-md flex items-start gap-stack-sm mb-section-gap shadow-sm border border-outline-variant/30 transition-all duration-300 hover:shadow-md cursor-pointer group" id="consent-container">
<div class="relative flex items-center pt-1">
<input class="peer sr-only" id="consent-checkbox" type="checkbox">
<div class="w-6 h-6 rounded border border-outline peer-checked:bg-primary peer-checked:border-primary flex items-center justify-center transition-colors group-hover:border-primary">
<span class="material-symbols-outlined text-on-primary text-[18px] opacity-0 peer-checked:opacity-100 transition-opacity" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<div class="absolute inset-0 rounded bg-primary opacity-0 peer-focus-visible:opacity-20 peer-focus-visible:scale-150 transition-all"></div>
</div>
<label class="text-body-md text-on-surface-variant cursor-pointer flex-1 leading-snug pt-0.5" for="consent-checkbox">
                I agree to the verification of my identity documents for safety purposes.
            </label>
</div>
<div class="mt-auto pt-stack-lg flex flex-col gap-stack-sm">
<button class="w-full h-14 rounded-full bg-primary text-on-primary text-label-md uppercase tracking-wider font-semibold shadow-sm transition-all duration-300 disabled:opacity-50 disabled:bg-surface-variant disabled:text-on-surface-variant disabled:shadow-none flex items-center justify-center gap-2 group overflow-hidden relative" disabled="" id="continue-btn">
<span class="relative z-10">Continue</span>
<span class="material-symbols-outlined relative z-10 transition-transform duration-300 group-hover:translate-x-1">arrow_forward</span>
</button>
<button class="w-full h-12 rounded-full bg-transparent text-secondary text-label-md flex items-center justify-center hover:bg-surface-variant/50 transition-colors">
                Why do we need this?
            </button>
</div>
</div>
<div class="absolute bottom-0 left-0 right-0 h-64 bg-gradient-to-t from-surface-variant/30 to-transparent pointer-events-none -z-0"></div>
<div class="absolute -top-32 -left-32 w-96 h-96 bg-primary-container/20 rounded-full blur-3xl opacity-50 pointer-events-none -z-0"></div>
<div class="absolute top-1/2 -right-32 w-80 h-80 bg-secondary-container/30 rounded-full blur-3xl opacity-60 pointer-events-none -z-0"></div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const checkbox = document.getElementById('consent-checkbox');
        const continueBtn = document.getElementById('continue-btn');
        const container = document.getElementById('consent-container');

        const updateButtonState = () => {
            continueBtn.disabled = !checkbox.checked;
            if(checkbox.checked) {
                container.classList.add('border-primary/50', 'bg-surface-container-high');
                container.classList.remove('border-outline-variant/30', 'bg-surface-container');
            } else {
                 container.classList.remove('border-primary/50', 'bg-surface-container-high');
                 container.classList.add('border-outline-variant/30', 'bg-surface-container');
            }
        };

        checkbox.addEventListener('change', updateButtonState);
        
        container.addEventListener('click', (e) => {
             if (e.target !== checkbox && e.target !== container.querySelector('label')) {
                 checkbox.checked = !checkbox.checked;
                 updateButtonState();
             }
        });
        
        continueBtn.addEventListener('click', (e) => {
             if(checkbox.checked) {
                 const btn = e.currentTarget;
                 const text = btn.querySelector('span');
                 const icon = btn.querySelectorAll('span')[1];
                 
                 btn.classList.add('scale-95');
                 setTimeout(() => btn.classList.remove('scale-95'), 150);
                 
                 text.textContent = 'Verifying...';
                 icon.textContent = 'autorenew';
                 icon.classList.add('animate-spin');
                 btn.classList.add('pointer-events-none');
             }
        });
    });
</script></main>

</body></html>
