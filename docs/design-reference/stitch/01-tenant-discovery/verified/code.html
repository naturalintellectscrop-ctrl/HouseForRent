<!-- Celebratory Icon -->
<div class="relative flex items-center justify-center w-24 h-24 mb-stack-lg rounded-full bg-primary-container shadow-md" id="icon-pulse" style="transform: scale(1); opacity: 1; transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease-out;">

<div class="absolute inset-0 pointer-events-none" id="particles-container"><div class="absolute top-1/2 left-1/2 w-2 h-2 rounded-full bg-primary-fixed-dim" style="transform: translate(calc(-50% + 60px), calc(-50% + 0px)) scale(0); opacity: 0; transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.8s ease-out;"></div><div class="absolute top-1/2 left-1/2 w-2 h-2 rounded-full bg-primary-fixed-dim" style="transform: translate(calc(-50% + 51.9615px), calc(-50% + 30px)) scale(0); opacity: 0; transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.8s ease-out;"></div><div class="absolute top-1/2 left-1/2 w-2 h-2 rounded-full bg-primary-fixed-dim" style="transform: translate(calc(-50% + 30px), calc(-50% + 51.9615px)) scale(0); opacity: 0; transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.8s ease-out;"></div><div class="absolute top-1/2 left-1/2 w-2 h-2 rounded-full bg-primary-fixed-dim" style="transform: translate(calc(-50% + 3.67394e-15px), calc(-50% + 60px)) scale(0); opacity: 0; transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.8s ease-out;"></div><div class="absolute top-1/2 left-1/2 w-2 h-2 rounded-full bg-primary-fixed-dim" style="transform: translate(calc(-50% - 30px), calc(-50% + 51.9615px)) scale(0); opacity: 0; transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.8s ease-out;"></div><div class="absolute top-1/2 left-1/2 w-2 h-2 rounded-full bg-primary-fixed-dim" style="transform: translate(calc(-50% - 51.9615px), calc(-50% + 30px)) scale(0); opacity: 0; transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.8s ease-out;"></div><div class="absolute top-1/2 left-1/2 w-2 h-2 rounded-full bg-primary-fixed-dim" style="transform: translate(calc(-50% - 60px), calc(-50% + 7.34788e-15px)) scale(0); opacity: 0; transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.8s ease-out;"></div><div class="absolute top-1/2 left-1/2 w-2 h-2 rounded-full bg-primary-fixed-dim" style="transform: translate(calc(-50% - 51.9615px), calc(-50% - 30px)) scale(0); opacity: 0; transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.8s ease-out;"></div><div class="absolute top-1/2 left-1/2 w-2 h-2 rounded-full bg-primary-fixed-dim" style="transform: translate(calc(-50% - 30px), calc(-50% - 51.9615px)) scale(0); opacity: 0; transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.8s ease-out;"></div><div class="absolute top-1/2 left-1/2 w-2 h-2 rounded-full bg-primary-fixed-dim" style="transform: translate(calc(-50% - 1.10218e-14px), calc(-50% - 60px)) scale(0); opacity: 0; transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.8s ease-out;"></div><div class="absolute top-1/2 left-1/2 w-2 h-2 rounded-full bg-primary-fixed-dim" style="transform: translate(calc(-50% + 30px), calc(-50% - 51.9615px)) scale(0); opacity: 0; transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.8s ease-out;"></div><div class="absolute top-1/2 left-1/2 w-2 h-2 rounded-full bg-primary-fixed-dim" style="transform: translate(calc(-50% + 51.9615px), calc(-50% - 30px)) scale(0); opacity: 0; transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.8s ease-out;"></div></div>
</div>
<!-- Typography -->
<h1 class="text-headline-lg font-headline-lg text-on-background mb-stack-sm opacity-0" id="success-title" style="transform: translateY(0px); transition: opacity 0.5s ease-out, transform 0.5s ease-out; opacity: 1;">
      Verification complete
    </h1>
<p class="text-body-lg font-body-lg text-secondary mb-section-gap opacity-0 max-w-[280px]" id="success-message" style="transform: translateY(0px); transition: opacity 0.5s ease-out, transform 0.5s ease-out; opacity: 1;">
      You're all set. You can now start searching for verified homes.
    </p>
</div>
<!-- Actions -->
<div class="flex flex-col w-full mt-auto mb-stack-lg opacity-0" id="success-action" style="transform: translateY(0px); transition: opacity 0.5s ease-out, transform 0.5s ease-out; opacity: 1;">
<button class="w-full bg-primary text-on-primary text-label-md font-label-md py-stack-md rounded-lg shadow-sm flex items-center justify-center gap-unit transition-transform active:scale-95">
      Start searching
      <span class="material-symbols-outlined text-body-md font-body-md">arrow_forward</span>
</button>
<p class="text-label-sm font-label-sm text-secondary text-center mt-stack-md">
      Always free for tenants
    </p>
</div>
<!-- Interaction & Animation Script -->
<script>
    document.addEventListener("DOMContentLoaded", () => {
      // Elements
      const iconPulse = document.getElementById('icon-pulse');
      const title = document.getElementById('success-title');
      const message = document.getElementById('success-message');
      const action = document.getElementById('success-action');
      const particlesContainer = document.getElementById('particles-container');

      // 1. Initial Icon Pop
      iconPulse.style.transform = 'scale(0.8)';
      iconPulse.style.opacity = '0';
      
      requestAnimationFrame(() => {
        iconPulse.style.transition = 'transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease-out';
        iconPulse.style.transform = 'scale(1)';
        iconPulse.style.opacity = '1';

        // Staggered text fade-ins
        setTimeout(() => {
          title.style.transition = 'opacity 0.5s ease-out, transform 0.5s ease-out';
          title.style.transform = 'translateY(0)';
          title.style.opacity = '1';
        }, 150);

        setTimeout(() => {
          message.style.transition = 'opacity 0.5s ease-out, transform 0.5s ease-out';
          message.style.transform = 'translateY(0)';
          message.style.opacity = '1';
        }, 300);

        setTimeout(() => {
          action.style.transition = 'opacity 0.5s ease-out, transform 0.5s ease-out';
          action.style.transform = 'translateY(0)';
          action.style.opacity = '1';
        }, 450);
      });

      // 2. Delightful Particle Burst
      const particleCount = 12;
      const radius = 60; // How far particles travel

      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'absolute top-1/2 left-1/2 w-2 h-2 rounded-full bg-primary-fixed-dim';
        particle.style.transform = 'translate(-50%, -50%)';
        particle.style.opacity = '1';
        particlesContainer.appendChild(particle);

        const angle = (i / particleCount) * Math.PI * 2;
        const tx = Math.cos(angle) * radius;
        const ty = Math.sin(angle) * radius;

        // Animate each particle
        requestAnimationFrame(() => {
          setTimeout(() => {
            particle.style.transition = 'transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.8s ease-out';
            particle.style.transform = `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(0)`;
            particle.style.opacity = '0';
          }, 50); // Slight delay to sync with icon pop
        });
      }
      
      // Setup initial state for staggered elements
      [title, message, action].forEach(el => {
        el.style.transform = 'translateY(10px)';
      });
    });
  </script>
</div></main>
