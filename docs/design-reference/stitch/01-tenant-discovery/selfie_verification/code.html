rface-bright': '#fcf8f8' }, borderRadius: { 'DEFAULT': '0.25rem', 'lg': '0.5rem', 'xl': '0.75rem', 'full': '9999px' }, spacing: { 'stack-md': '16px', 'container-margin': '20px', 'unit': '4px', 'section-gap': '48px', 'gutter': '16px', 'stack-sm': '8px', 'stack-lg': '32px' }, fontFamily: { 'body-lg': ['Hanken Grotesk'], 'headline-lg': ['Hanken Grotesk'], 'display-lg': ['Hanken Grotesk'], 'label-sm': ['Hanken Grotesk'], 'headline-sm': ['Hanken Grotesk'], 'headline-md': ['Hanken Grotesk'], 'label-md': ['Hanken Grotesk'], 'body-md': ['Hanken Grotesk'] } } } };</script></head><body class="bg-background pt-safe pb-safe flex flex-col min-h-screen"><main class="flex flex-col flex-1 relative w-full"><div class="flex flex-col w-full px-container-margin gap-stack-lg pb-stack-lg mt-stack-md"><div class="flex justify-center mb-stack-md"><img src="https://lh3.googleusercontent.com/aida-public/AB6AXuA6UKOf-Eu46XOnSJf_K-M8ZcYys96qulr-Sk5mjXB0KE861mDrl083kvXGihLYYSVb5UCHy5EEvmi4h6zVkV5hAEx317dGSnpw9curGhSh5bZ1R_ZNsd7LPWhULxm3-DiHL5tcPpFU6AnRaSzV-3akg4-Hx2XLV0CNzEHcaWbrVDu88S8amLVfscm-Lm6-h6wY7mXSjRbQozu6fVk5nfcJvKjZRPcwUl7yYzrnRaWt4Pno1t1EznovtM0lxXvVx5rmLWe8AI8JatA" alt="House For Rent Logo" class="h-10 w-auto object-contain"></div>

<h1 class="font-headline-md text-headline-md text-on-background">Take a selfie</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">

<defs>
<mask id="face-cutout">
<rect fill="white" height="100%" width="100%"></rect>
<ellipse cx="50%" cy="45%" fill="black" rx="35%" ry="40%"></ellipse>

<rect class="fill-background" fill-opacity="0.85" height="100%" mask="url(#face-cutout)" width="100%"></rect>

<ellipse class="stroke-primary" cx="50%" cy="45%" fill="none" rx="35%" ry="40%" stroke-dasharray="12 12" stroke-width="4"></ellipse>

<div class="absolute bottom-stack-md left-0 right-0 flex justify-center pointer-events-none">
<div class="bg-primary/90 backdrop-blur-sm px-gutter py-unit rounded-full shadow-sm flex items-center gap-unit transition-transform animate-pulse">
<span class="material-symbols-outlined text-on-primary text-[18px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-md text-label-md text-on-primary">Good lighting detected</span>
</div>
</div>

<div class="flex flex-col bg-surface-container rounded-xl shadow-sm overflow-hidden">

</div>

<div class="w-full h-px bg-surface-variant"></div>

<div class="flex items-center gap-gutter p-stack-md">

</div>
<div class="flex flex-col">

<span class="font-body-md text-body-md text-on-surface-variant text-[14px]">Avoid shadows and bright backlights</span>
</div>
</div>
</div>

<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-stack-md rounded-lg shadow-sm flex items-center justify-center gap-unit transition-all active:scale-[0.98]">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">photo_camera</span>

<div class="flex items-center justify-center gap-unit text-on-surface-variant opacity-80 mt-[-8px]">
<span class="material-symbols-outlined text-[16px]">lock</span>
<span class="font-label-sm text-label-sm">Your data is securely encrypted</span>
</div>
</div></main>
