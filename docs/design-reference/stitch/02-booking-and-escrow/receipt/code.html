<script>
  // Initial animation
  setTimeout(() => {
    document.getElementById('success-icon').classList.remove('scale-0');
    document.getElementById('success-icon').classList.add('scale-100');
    createConfetti();
  }, 300);

  // Set current date
  const dateOptions = { year: 'numeric', month: 'short', day: 'numeric' };
  document.getElementById('current-date').textContent = new Date().toLocaleDateString('en-US', dateOptions);

  function createConfetti() {
    const container = document.getElementById('confetti-container');
    const colors = ['#0a5514', '#81c97a', '#aaf5a0', '#276c28'];
    
    for (let i = 0; i < 24; i++) {
      const particle = document.createElement('div');
      particle.style.position = 'absolute';
      particle.style.width = '8px';
      particle.style.height = '8px';
      particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      particle.style.borderRadius = i % 2 === 0 ? '50%' : '2px';
      particle.style.left = '50%';
      particle.style.top = '50%';
      
      const angle = Math.random() * Math.PI * 2;
      const velocity = 50 + Math.random() * 100;
      const tx = Math.cos(angle) * velocity;
      const ty = Math.sin(angle) * velocity;
      const rotation = Math.random() * 360;

      container.appendChild(particle);

      particle.animate([
        { transform: 'translate(-50%, -50%) scale(1) rotate(0deg)', opacity: 1 },
        { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(0) rotate(${rotation}deg)`, opacity: 0 }
      ], {
        duration: 1500 + Math.random() * 1000,
        easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)',
        fill: 'forwards'
      });
    }
  }
