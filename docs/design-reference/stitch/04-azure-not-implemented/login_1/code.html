<!-- BEGIN: Login Modal -->
<div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-[2rem] p-6 pt-4 z-20 shadow-[0_-10px_40px_rgba(0,0,0,0.1)] flex flex-col h-[65%]">
<!-- Drag handle indicator -->
<div class="drag-handle mb-6"></div>
<!-- Header -->
<div class="mb-8">
<h2 class="text-2xl font-bold text-gray-900 mb-1">Welcome Back</h2>
<p class="text-gray-400 text-sm">Login to continue your home search</p>
</div>
<!-- Form -->
<form class="flex-1 flex flex-col">
<!-- Email Field -->
<div class="mb-5">
<label class="block text-sm font-semibold text-gray-900 mb-2" for="email">Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<i class="fa-regular fa-envelope text-gray-400"></i>
</div>
<input class="bg-gray-50 border border-transparent text-gray-900 text-sm rounded-2xl focus:ring-primary focus:border-primary block w-full pl-10 p-3.5 placeholder-gray-400" id="email" placeholder="Enter your email" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="mb-8">
<label class="block text-sm font-semibold text-gray-900 mb-2" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<i class="fa-solid fa-lock text-gray-400 text-sm"></i>
</div>
<input class="bg-gray-50 border border-transparent text-gray-900 text-sm rounded-2xl focus:ring-primary focus:border-primary block w-full pl-10 pr-10 p-3.5 placeholder-gray-400" id="password" placeholder="Enter your password" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none" type="button">
<i class="fa-regular fa-eye"></i>
</button>
</div>
</div>
<div class="mt-auto">
<!-- Login Button -->
<button class="w-full text-white bg-primary hover:bg-blue-700 focus:ring-4 focus:outline-none focus:ring-blue-300 font-semibold rounded-2xl text-sm px-5 py-4 text-center transition duration-200" type="submit">
            Login
          </button>
<!-- Sign Up Link -->
<div class="text-center mt-6 mb-2">
<p class="text-sm text-gray-500">
              Don't have an account? <a class="text-primary font-semibold hover:underline" href="#">Sign Up</a>
</p>
</div>
</div>
</form>
<!-- Simulated Home Indicator -->
<div class="w-1/3 h-1 bg-gray-300 rounded-full mx-auto mt-4 absolute bottom-2 left-1/2 transform -translate-x-1/2"></div>
</div>
<!-- END: Login Modal -->
